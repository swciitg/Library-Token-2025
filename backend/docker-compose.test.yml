version: "3.3"
services:
  library_token_backend_test:
    container_name: library_token_backend_test
    image: library_token_backend_test
    build:
      context: .
      dockerfile: Dockerfile.test
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9573:3001"
    env_file:
      - .env.test
    networks:
      - library-token_backend_test
    depends_on:
      - redis  

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data-library:/data 


networks:
  library-token_backend_test:
    external: true
volumes:
  redis-data-library: 